org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Конфигурационный кэш выключен намеренно: при нём фаза конфигурации
# переиспользуется из кэша и автоинкремент версии перестаёт срабатывать.
# Проект маленький, выигрыш от кэша здесь меньше, чем польза от версий.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Токен автозапуска Shizuku на часах. Смотреть в приложении Shizuku:
# "Управляйте Shizuku с помощью приложений автоматизации" -> "Просмотр
# намерений" -> Extras -> auth. Меняется, если нажать там кнопку обновления.
shizukuAuth=
